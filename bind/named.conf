# 本地权威 BIND（仅用于演示/测试）。
# 监听容器内 53；允许 TSIG 密钥对 acme.test 区域做动态更新。
options {
    directory "/var/cache/bind";
    listen-on port 53 { any; };
    listen-on-v6 { none; };
    recursion no;
    allow-query { any; };
    dnssec-validation no;
    pid-file "/var/run/named/named.pid";
    session-keyfile "/var/run/named/session.key";
};

# TSIG 密钥：值由环境变量 BIND_TSIG_SECRET 在容器启动时渲染（entrypoint）
key "acme-key." {
    algorithm hmac-sha256;
    secret "TSIG_SECRET_PLACEHOLDER";
};

zone "acme.test" {
    type master;
    # 动态更新需要 named 对该文件及其目录有写权限（journal 落盘在同目录）
    file "/var/lib/bind/zones/db.acme.test";
    allow-update {
        key "acme-key.";
    };
};

zone "10.in-addr.arpa" {
    type master;
    file "/var/lib/bind/zones/db.10";
    allow-update { none; };
};
